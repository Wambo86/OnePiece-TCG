name: Daten aktualisieren und veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'   # täglich, nach dem Cardmarket-Export
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Karten und Cardmarket-Preise holen
        # Die Daten liegen nicht im Repository. Schlägt der Abruf fehl, bricht der Lauf ab und die zuletzt veröffentlichte Seite bleibt online.
        run: node scripts/build-data.mjs
      - name: Seite zusammenstellen
        run: |
          mkdir _site
          cp -r index.html app.js game.js styles.css sw.js manifest.webmanifest icons vendor data _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
